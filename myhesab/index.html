<body>
<div class="shell">
<aside class="side">
  <div class="brand"><span class="mark">۸</span><div><strong>مای‌حساب</strong><small>حسابداری برای فریلنسرها</small></div></div>
  <nav>
    <button class="nav active" data-tab="dashboard"><span>⌂</span>نمای کلی</button>
    <button class="nav" data-tab="projects"><span>▣</span>پروژه‌ها</button>
    <button class="nav" data-tab="income"><span>↙</span>دریافتی‌ها</button>
    <button class="nav" data-tab="expenses"><span>↗</span>هزینه‌ها</button>
    <button class="nav" data-tab="reports"><span>◫</span>گزارش‌ها</button>
  </nav>
  <div class="tip"><span>✦</span><strong>آماده شروع هستی</strong><p>اولین پروژه، دریافتی یا هزینه را ثبت کن تا گزارش‌های مالی ساخته شوند.</p></div>
  <div class="profile"><span class="avatar">ا</span><div><strong>امیرعباس علوی</strong><small>amirabbas@gmail.com</small></div><button>•••</button></div>
</aside>

<div class="main">
  <header>
    <div class="modes">
      <button class="active" data-mode="work">کاری</button>
      <button data-mode="total">کل زندگی</button>
    </div>
    <div class="actions">
      <button class="icon" id="stealth">◉</button>
      <button class="icon">♢</button>
      <button class="primary" id="openQuick">＋ ثبت جدید</button>
    </div>
  </header>
  <main class="content" id="content"></main>
</div>
</div>

<!-- Quick type picker modal -->
<div class="backdrop" id="quick">
  <div class="modal">
    <button class="close" data-close="quick">×</button>
    <div class="mhead"><span>＋</span><div><h2>چه چیزی ثبت می‌کنی؟</h2><p>ثبت منظم، تصویر مالی دقیق‌تری به تو می‌دهد.</p></div></div>
    <div class="options">
      <button data-open-form="expenses"><i class="red">↗</i><div><strong>هزینه جدید</strong><small>کاری، پروژه‌ای یا شخصی</small></div><b>←</b></button>
      <button data-open-form="income"><i>↙</i><div><strong>دریافتی یا سررسید</strong><small>ثبت قسط و پرداخت پروژه</small></div><b>←</b></button>
      <button data-open-form="projects"><i class="purple">▣</i><div><strong>پروژه جدید</strong><small>قرارداد و کارفرمای تازه</small></div><b>←</b></button>
    </div>
  </div>
</div>

<!-- Entry form modal -->
<div class="backdrop" id="formBackdrop">
  <form class="modal form" id="entryForm" autocomplete="off">
    <button type="button" class="close" data-close="formBackdrop">×</button>
    <div class="mhead">
      <span id="formIcon">↗</span>
      <div><h2 id="formTitle">ثبت رکورد جدید</h2><p id="formDesc">اطلاعات اصلی را وارد کن؛ بعداً قابل ویرایش است.</p></div>
    </div>

    <!-- Project fields -->
    <div class="form-fields-project" id="fieldsProject">
      <label>نام پروژه<input id="pName" placeholder="مثلاً: طراحی سایت فروشگاهی"></label>
      <label>نام کارفرما<input id="pClient" placeholder="مثلاً: شرکت آلفا"></label>
      <div class="formrow">
        <label>ارزش قرارداد (تومان)<input id="pValue" type="number" placeholder="مثلاً 15000000"></label>
        <label>وضعیت
          <select id="pStatus">
            <option>پیش‌نویس</option>
            <option>در حال اجرا</option>
            <option>تکمیل شده</option>
          </select>
        </label>
      </div>
      <div class="formrow">
        <label>تاریخ شروع<input id="pStartDate" placeholder="مثلاً: ۱ خرداد ۱۴۰۵"></label>
        <label>تاریخ پایان (تحویل)<input id="pEndDate" placeholder="مثلاً: ۱ شهریور ۱۴۰۵"></label>
      </div>
      <label>توضیحات (اختیاری)<textarea id="pDesc" rows="2" placeholder="توضیح کوتاه درباره پروژه..."></textarea></label>
    </div>

    <!-- Income fields -->
    <div class="form-fields-income" id="fieldsIncome">
      <label>پروژه مرتبط
        <select id="iProject"><option value="">-- انتخاب پروژه --</option></select>
      </label>
      <label>عنوان مرحله پرداخت<input id="iName" placeholder="مثلاً: پیش‌پرداخت، قسط اول، تسویه نهایی"></label>
      <div class="formrow">
        <label>مبلغ (تومان)<input id="iAmount" type="number" placeholder="مثلاً 5000000"></label>
        <label>تاریخ سررسید<input id="iDate" placeholder="مثلاً: ۱ تیر ۱۴۰۵"></label>
      </div>
      <label>وضعیت
        <select id="iStatus">
          <option value="در انتظار">در انتظار دریافت</option>
          <option value="دریافت شده">دریافت شده</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="iPassThrough">این مبلغ بودجه امانتی کارفرماست (از سود من نیست)</label>
    </div>

    <!-- Expense fields -->
    <div class="form-fields-expense" id="fieldsExpense">
      <label>عنوان هزینه<input id="eName" placeholder="مثلاً: اشتراک Figma"></label>
      <label>پروژه مرتبط (اختیاری)
        <select id="eProject"><option value="">-- هزینه عمومی کاری --</option></select>
      </label>
      <div class="formrow">
        <label>مبلغ (تومان)<input id="eAmount" type="number" placeholder="مثلاً 2500000"></label>
        <label>دسته‌بندی
          <select id="eCat">
            <option>هزینه مستقیم پروژه</option>
            <option>همکار / برون‌سپاری</option>
            <option>ابزار کاری</option>
            <option>اشتراک نرم‌افزار</option>
            <option>تبلیغات</option>
            <option>اینترنت / زیرساخت</option>
            <option>رفت‌وآمد</option>
            <option>سایر</option>
          </select>
        </label>
      </div>
      <div class="formrow">
        <label>نوع هزینه
          <select id="eType">
            <option value="BUSINESS_OVERHEAD">هزینه عمومی کاری</option>
            <option value="DIRECT_PROJECT">هزینه مستقیم پروژه</option>
            <option value="OUTSOURCE">همکار / برون‌سپاری</option>
          </select>
        </label>
        <label>تاریخ<input id="eDate" placeholder="مثلاً: ۱ تیر ۱۴۰۵"></label>
      </div>
      <label class="check"><input type="checkbox" id="ePassThrough">از محل بودجه امانتی کارفرما پرداخت شده</label>
    </div>

    <button class="primary" type="submit">ثبت و ذخیره</button>
  </form>
</div>

<div class="toast" id="toastEl"></div>

<script>
// ── Jalali date helper ────────────────────────────────────────────
function toJalali(gy,gm,gd){
  const g=[31,28,31,30,31,30,31,31,30,31,30,31],j=[31,31,31,31,31,31,30,30,30,30,30,29];
  let y=gy>1600?gy-1600:gy-1;
  let gdn=365*y+Math.floor((y+3)/4)-Math.floor((y+99)/100)+Math.floor((y+399)/400);
  for(let i=0;i<gm-1;i++)gdn+=g[i];
  if(gm>2&&((gy%4===0&&gy%100!==0)||(gy+400)%400===0))gdn++;
  gdn+=gd-1;
  let jdn=gdn-79,jnp=Math.floor(jdn/12053);
  jdn%=12053;
  let jy=979+33*jnp+4*Math.floor(jdn/1461);
  jdn%=1461;
  if(jdn>=366){jy+=Math.floor((jdn-1)/365);jdn=(jdn-1)%365;}
  let i;for(i=0;i<11&&jdn>=j[i];i++)jdn-=j[i];
  return[jy,i+1,jdn+1];
}
const jMonths=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];

// ── Projects ──────────────────────────────────────────────────────
function computeProjectProfit(p){
  const paid=records.income.filter(x=>x.project===p.name&&x.status==="دریافت شده"&&!x.isClientBudget).reduce((s,x)=>s+x.amount,0);
  const directCost=records.expenses.filter(x=>x.project===p.name&&!x.isClientBudget).reduce((s,x)=>s+x.amount,0);
  return paid-directCost;
}
function renderProjects(list=records.projects){
  const totalValue=records.projects.reduce((s,p)=>s+p.value,0);
  const totalProfit=records.projects.reduce((s,p)=>s+computeProjectProfit(p),0);
  const active=records.projects.filter(p=>p.status==="در حال اجرا").length;
  const open=records.income.filter(x=>x.status!=="دریافت شده"&&!x.isClientBudget).reduce((s,x)=>s+x.amount,0);
  content.innerHTML=pageHead("projects")+
    `<section class="metric-grid">

      ${metric("سود واقعی",fa(totalProfit)+" تومان",totalValue?`بر اساس دریافتی‌های وصول‌شده`:"بدون داده")}
      ${metric("در حال اجرا",`${fa(active)} پروژه`,"فعال")}

    `<section class="data-panel" id="rows">
      <div class="table-row header"><div>پروژه و کارفرما</div><div>ارزش قرارداد</div><div>سود واقعی</div><div>پیشرفت مالی</div><div>وضعیت</div></div>
      ${list.map((p,i)=>{
        const profit=computeProjectProfit(p);
        const paid=records.income.filter(x=>x.project===p.name&&x.status==="دریافت شده"&&!x.isClientBudget).reduce((s,x)=>s+x.amount,0);
        const pct=p.value?Math.min(Math.round(paid/p.value*100),100):p.progress;
        return `<div class="table-row clickable">
          <div class="pname"><span class="picon">${(p.client[0])||"؟"}</span><div><strong>${p.name}</strong><small>${p.client}${p.endDate?` · تحویل: ${p.endDate}`:""}</small></div></div>

      }).join("")||`<div class="empty">هنوز پروژه‌ای ثبت نشده است.</div>`}
    </section>`;
  bindList("projects");
}

// ── Bind helpers ──────────────────────────────────────────────────
function bindCommon(){
  document.querySelectorAll(".add-record").forEach(b=>b.onclick=()=>openForm(b.dataset.type||currentTab));
  document.querySelectorAll(".export").forEach(b=>b.onclick=()=>toast("گزارش آماده دریافت شد"));
  document.querySelectorAll(".ranges button").forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");toast("بازه گزارش به‌روزرسانی شد")});
}

function bindDashboard(){
  bindCommon();
  const sa=document.getElementById("showAllProjects");
  if(sa)sa.onclick=()=>showTab("projects");
}

function bindList(type){
  bindCommon();
  const search=document.getElementById("search"),filter=document.getElementById("filter");
  const apply=()=>document.querySelectorAll("#rows .table-row:not(.header)").forEach(r=>{
    r.style.display=(!search.value.trim()||r.textContent.includes(search.value.trim()))&&(!filter.value||r.textContent.includes(filter.value))?"grid":"none"
  });
  if(search)search.oninput=apply;
  if(filter)filter.onchange=apply;
  document.querySelectorAll(".delete").forEach(b=>b.onclick=()=>{records[type].splice(+b.dataset.i,1);renderTransactions(type);toast("رکورد حذف شد")});
  document.querySelectorAll(".status-btn").forEach(b=>b.onclick=()=>{
    const r=records[type][+b.dataset.i];
    if(type==="projects"){r.status=r.status==="در حال اجرا"?"تکمیل شده":"در حال اجرا";r.progress=r.status==="تکمیل شده"?100:70}
    else if(type==="income")r.status="دریافت شده";
    else r.status=r.status==="کاری"?"شخصی":"کاری";
    type==="projects"?renderProjects():renderTransactions(type);
    toast("وضعیت به‌روزرسانی شد");
  });
}

// ── Tab navigation ────────────────────────────────────────────────
function showTab(tab){

  scrollTo(0,0);
}

  const iSel=document.getElementById("iProject");
  const eSel=document.getElementById("eProject");
  if(iSel){const prev=iSel.value;iSel.innerHTML=`<option value="">-- انتخاب پروژه --</option>`+opts;if(prev)iSel.value=prev;}
  if(eSel){const prev=eSel.value;eSel.innerHTML=`<option value="">-- هزینه عمومی کاری --</option>`+opts;if(prev)eSel.value=prev;}
}

function openForm(type,preProject=""){
  formType=type||"expenses";
  const m=formMeta[formType]||formMeta.expenses;
  document.getElementById("formIcon").textContent=m.icon;
  document.getElementById("formTitle").textContent=m.title;
  document.getElementById("formDesc").textContent=m.desc;
  document.querySelectorAll(".form-fields-project,.form-fields-income,.form-fields-expense").forEach(el=>el.classList.remove("active"));
  if(formType==="projects"){
    document.getElementById("fieldsProject").classList.add("active");
  } else if(formType==="income"){
    document.getElementById("fieldsIncome").classList.add("active");
    document.getElementById("iDate").value=todayStr();
    populateProjectDropdowns();
    if(preProject)document.getElementById("iProject").value=preProject;
  } else {
    document.getElementById("fieldsExpense").classList.add("active");
    document.getElementById("eDate").value=todayStr();
    populateProjectDropdowns();
    if(preProject)document.getElementById("eProject").value=preProject;
  }
  q.classList.remove("open");
  fb.classList.add("open");
}

function closeBackdrop(id){document.getElementById(id).classList.remove("open")}

// ── Event bindings ────────────────────────────────────────────────
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

document.getElementById("openQuick").onclick=()=>q.classList.add("open");

document.querySelectorAll("[data-open-form]").forEach(b=>b.onclick=()=>openForm(b.dataset.openForm));

document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeBackdrop(b.dataset.close));

document.querySelectorAll(".backdrop").forEach(b=>b.onclick=e=>{if(e.target===b)b.classList.remove("open")});

document.getElementById("stealth").onclick=()=>document.body.classList.toggle("stealth");

// Mode switch (کاری / کل زندگی) — با guard برای onboarding
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
  if(currentTab!=="dashboard")return;
  document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  appMode=b.dataset.mode;
  if(!records.projects.length)return; // onboarding state, no elements to update
  renderDashboard(); // re-render with new mode
});

// Form submit — reads real inputs, uses formType
document.getElementById("entryForm").onsubmit=e=>{
  e.preventDefault();
  const today=todayStr();
  if(formType==="projects"){
    const name=document.getElementById("pName").value.trim()||"پروژه جدید";
    const client=document.getElementById("pClient").value.trim()||"کارفرمای جدید";
    const value=parseInt(document.getElementById("pValue").value)||0;
    const status=document.getElementById("pStatus").value;
    const startDate=document.getElementById("pStartDate").value.trim();
    const endDate=document.getElementById("pEndDate").value.trim();
    const desc=document.getElementById("pDesc").value.trim();
    records.projects.unshift({name,client,value,status,startDate,endDate,desc,progress:status==="تکمیل شده"?100:status==="در حال اجرا"?50:10});
    document.getElementById("entryForm").reset();
    fb.classList.remove("open");
    if(currentTab==="dashboard")renderDashboard();
    else showTab(currentTab);
    toast("پروژه ثبت شد — حالا برنامه پرداخت را اضافه کن");
    setTimeout(()=>openForm("income",name),700);
    return;
  } else if(formType==="income"){
    const project=document.getElementById("iProject").value.trim();
    const name=document.getElementById("iName").value.trim()||"مرحله پرداخت";
    const amount=parseInt(document.getElementById("iAmount").value)||0;
    const date=document.getElementById("iDate").value||today;
    const status=document.getElementById("iStatus").value||"در انتظار";
    const isClientBudget=document.getElementById("iPassThrough").checked;
    const client=project?(records.projects.find(p=>p.name===project)||{}).client||"":"";
    records.income.unshift({name,project,client,amount,date,status,isClientBudget});
  } else {
    const name=document.getElementById("eName").value.trim()||"هزینه جدید";
    const project=document.getElementById("eProject").value.trim();
    const amount=parseInt(document.getElementById("eAmount").value)||0;
    const cat=document.getElementById("eCat").value;
    const expenseType=document.getElementById("eType").value;
    const date=document.getElementById("eDate").value||today;
    const isClientBudget=document.getElementById("ePassThrough").checked;
    records.expenses.unshift({name,project,cat,amount,date,expenseType,isClientBudget,status:expenseType==="BUSINESS_OVERHEAD"?"کاری":"پروژه‌ای"});
  }
  document.getElementById("entryForm").reset();
  fb.classList.remove("open");
  if(currentTab==="dashboard")renderDashboard();
  else showTab(currentTab);
  toast("با موفقیت ثبت شد");
};

// ── Init ──────────────────────────────────────────────────────────
showTab("dashboard");
</script>
</body>
</html>
